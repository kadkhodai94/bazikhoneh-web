name: Build Flutter From ZIP

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  VERSION_NAME: 1.1.4
  VERSION_CODE: 6

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Find and unzip project
        shell: bash
        run: |
          set -e

          echo "Files in repository:"
          ls -la

          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1 || true)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository."
            exit 1
          fi

          echo "ZIP found: $ZIP_FILE"

          rm -rf extracted_project
          mkdir -p extracted_project
          unzip -o "$ZIP_FILE" -d extracted_project

          PUBSPEC_PATH=$(find extracted_project -type f -name "pubspec.yaml" | head -n 1 || true)

          if [ -z "$PUBSPEC_PATH" ]; then
            echo "ERROR: pubspec.yaml not found inside ZIP."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC_PATH")

          echo "Flutter project found at: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Disable Flutter analytics
        run: flutter config --no-analytics

      - name: Create Android folder if missing
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ ! -d "android" ]; then
            flutter create . \
              --platforms=android \
              --project-name=bazikhone_native \
              --org=com.lalenawid \
              --no-overwrite
          else
            echo "Android folder already exists."
          fi

      - name: Patch Adivery nullable bool error
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import re

          lib_dir = Path("lib")
          if not lib_dir.exists():
              print("No lib directory found. Skipping Dart patch.")
              raise SystemExit(0)

          changed_files = []

          pattern = re.compile(
              r'(\b[a-zA-Z_][a-zA-Z0-9_]*\s*=\s*)await\s+AdiveryPlugin\.isLoaded\(([^;\n]+)\);'
          )

          for path in lib_dir.rglob("*.dart"):
              text = path.read_text(encoding="utf-8")
              new_text = pattern.sub(
                  r'\1(await AdiveryPlugin.isLoaded(\2)) ?? false;',
                  text
              )

              if new_text != text:
                  path.write_text(new_text, encoding="utf-8")
                  changed_files.append(str(path))

          if changed_files:
              print("Patched Adivery nullable bool in:")
              for item in changed_files:
                  print("-", item)
          else:
              print("No Adivery nullable bool assignment found or already patched.")
          PY

      - name: Flutter pub get
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release --no-shrink --build-name=${{ env.VERSION_NAME }} --build-number=${{ env.VERSION_CODE }}

      - name: Build release AAB
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build appbundle --release --build-name=${{ env.VERSION_NAME }} --build-number=${{ env.VERSION_CODE }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bazikhone-native-v${{ env.VERSION_NAME }}-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: bazikhone-native-v${{ env.VERSION_NAME }}-aab
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/bundle/release/app-release.aab
