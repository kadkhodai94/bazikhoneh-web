name: Build Flutter WebView APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find latest ZIP and unzip
        run: |
          ZIP_FILE=$(ls -t *.zip 2>/dev/null | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP file found in repository root"
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"

          rm -rf extracted clean_project
          mkdir extracted
          unzip -q "$ZIP_FILE" -d extracted

          SOURCE_DIR=$(find extracted -name "pubspec.yaml" -exec dirname {} \; | head -n 1)

          if [ -z "$SOURCE_DIR" ]; then
            echo "pubspec.yaml not found after unzip"
            exit 1
          fi

          echo "SOURCE_DIR=$SOURCE_DIR" >> $GITHUB_ENV

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable

      - name: Create clean Flutter Android project
        run: |
          flutter create -t app --platforms=android --project-name bazikhone_webview clean_project

          rm -rf clean_project/lib
          cp -r "$SOURCE_DIR/lib" clean_project/lib

          cp "$SOURCE_DIR/pubspec.yaml" clean_project/pubspec.yaml

          if [ -d "$SOURCE_DIR/assets" ]; then
            rm -rf clean_project/assets
            cp -r "$SOURCE_DIR/assets" clean_project/assets
          fi

          if [ -d "$SOURCE_DIR/web_assets" ]; then
            rm -rf clean_project/web_assets
            cp -r "$SOURCE_DIR/web_assets" clean_project/web_assets
          fi

      - name: Flutter pub get
        working-directory: clean_project
        run: flutter pub get

      - name: Build APK
        working-directory: clean_project
        run: flutter build apk --release

      - name: Build AAB
        working-directory: clean_project
        run: flutter build appbundle --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bazikhone-webview-apk
          path: clean_project/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: bazikhone-webview-aab
          path: clean_project/build/app/outputs/bundle/release/app-release.aab
