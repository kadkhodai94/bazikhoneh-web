name: Build Latest Flutter ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-latest-zip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Find latest ZIP in repository root
        id: find_zip
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          root = Path(os.environ["GITHUB_WORKSPACE"])

          zip_files = [
              p for p in root.glob("*.zip")
              if p.is_file()
              and not p.name.startswith("_")
              and "build" not in p.name.lower()
              and "artifact" not in p.name.lower()
          ]

          if not zip_files:
              print("ERROR: No ZIP file found in repository root.")
              raise SystemExit(1)

          def extract_version(name: str):
              """
              Supports names like:
              gamino_v1.zip
              gamino_v1_2.zip
              gamino_v1_2_3.zip
              gamino-1.2.3.zip
              gamino_v10_premium.zip
              """
              lower = name.lower()

              patterns = [
                  r'v(\d+(?:[._-]\d+){0,4})',
                  r'(\d+\.\d+(?:\.\d+){0,3})',
                  r'(\d+_\d+(?:_\d+){0,3})',
              ]

              for pattern in patterns:
                  matches = re.findall(pattern, lower)
                  if matches:
                      raw = matches[-1]
                      parts = re.split(r'[._-]', raw)
                      nums = []
                      for part in parts:
                          try:
                              nums.append(int(part))
                          except ValueError:
                              nums.append(0)
                      while len(nums) < 5:
                          nums.append(0)
                      return tuple(nums)

              return (0, 0, 0, 0, 0)

          def score(path: Path):
              version = extract_version(path.name)
              mtime = path.stat().st_mtime
              return (version, mtime)

          selected = sorted(zip_files, key=score, reverse=True)[0]

          version = extract_version(selected.name)
          print(f"Selected ZIP: {selected.name}")
          print(f"Detected version: {'.'.join(map(str, version)).rstrip('.0')}")

          out = Path(os.environ["GITHUB_OUTPUT"])
          with out.open("a", encoding="utf-8") as f:
              f.write(f"zip_path={selected}\n")
              f.write(f"zip_name={selected.name}\n")
          PY

      - name: Extract selected ZIP
        id: extract_zip
        shell: bash
        run: |
          set -euo pipefail

          ZIP_PATH="${{ steps.find_zip.outputs.zip_path }}"
          EXTRACT_DIR="$GITHUB_WORKSPACE/_latest_unzipped"

          rm -rf "$EXTRACT_DIR"
          mkdir -p "$EXTRACT_DIR"

          echo "Extracting: $ZIP_PATH"
          unzip -q "$ZIP_PATH" -d "$EXTRACT_DIR"

          echo "extract_dir=$EXTRACT_DIR" >> "$GITHUB_OUTPUT"

      - name: Locate Flutter project inside extracted ZIP
        id: locate_project
        shell: bash
        run: |
          set -euo pipefail

          EXTRACT_DIR="${{ steps.extract_zip.outputs.extract_dir }}"

          PUBSPEC="$(find "$EXTRACT_DIR" -type f -name pubspec.yaml | head -n 1 || true)"

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml not found inside extracted ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PUBSPEC")"

          if [ ! -d "$PROJECT_DIR/lib" ]; then
            echo "ERROR: lib directory not found beside pubspec.yaml."
            exit 1
          fi

          echo "Flutter project found at: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Read app version from pubspec
        id: app_version
        shell: bash
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        run: |
          set -euo pipefail

          VERSION_LINE="$(grep '^version:' pubspec.yaml | head -n 1 || true)"

          if [ -z "$VERSION_LINE" ]; then
            BUILD_NAME="1.0.0"
            BUILD_NUMBER="1"
          else
            RAW_VERSION="$(echo "$VERSION_LINE" | sed 's/version:[[:space:]]*//g' | tr -d '"')"

            if echo "$RAW_VERSION" | grep -q '+'; then
              BUILD_NAME="$(echo "$RAW_VERSION" | cut -d '+' -f 1)"
              BUILD_NUMBER="$(echo "$RAW_VERSION" | cut -d '+' -f 2)"
            else
              BUILD_NAME="$RAW_VERSION"
              BUILD_NUMBER="1"
            fi
          fi

          if [ -z "$BUILD_NAME" ]; then BUILD_NAME="1.0.0"; fi
          if [ -z "$BUILD_NUMBER" ]; then BUILD_NUMBER="1"; fi

          echo "Build name: $BUILD_NAME"
          echo "Build number: $BUILD_NUMBER"

          echo "build_name=$BUILD_NAME" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Prepare clean Flutter Android project
        shell: bash
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        run: |
          set -euo pipefail

          BACKUP_DIR="$GITHUB_WORKSPACE/_flutter_backup"
          rm -rf "$BACKUP_DIR"
          mkdir -p "$BACKUP_DIR"

          cp -f pubspec.yaml "$BACKUP_DIR/pubspec.yaml"
          cp -rf lib "$BACKUP_DIR/lib"

          if [ -d assets ]; then
            cp -rf assets "$BACKUP_DIR/assets"
          fi

          if [ -d fonts ]; then
            cp -rf fonts "$BACKUP_DIR/fonts"
          fi

          if [ -d images ]; then
            cp -rf images "$BACKUP_DIR/images"
          fi

          if [ -d .github ]; then
            cp -rf .github "$BACKUP_DIR/.github"
          fi

          rm -rf android

          flutter create . \
            --platforms android \
            --org ir.gamino.app \
            --project-name gamino_game_platform

          rm -rf lib
          cp -rf "$BACKUP_DIR/lib" ./lib
          cp -f "$BACKUP_DIR/pubspec.yaml" ./pubspec.yaml

          if [ -d "$BACKUP_DIR/assets" ]; then
            rm -rf assets
            cp -rf "$BACKUP_DIR/assets" ./assets
          fi

          if [ -d "$BACKUP_DIR/fonts" ]; then
            rm -rf fonts
            cp -rf "$BACKUP_DIR/fonts" ./fonts
          fi

          if [ -d "$BACKUP_DIR/images" ]; then
            rm -rf images
            cp -rf "$BACKUP_DIR/images" ./images
          fi

          if grep -R "Flutter Demo Home Page" -n lib pubspec.yaml; then
            echo "ERROR: Flutter demo code detected. Build stopped."
            exit 1
          fi

      - name: Install dependencies
        shell: bash
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        run: flutter pub get

      - name: Analyze project
        shell: bash
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        run: flutter analyze || true

      - name: Build release APK
        shell: bash
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        run: |
          flutter build apk --release \
            --build-name=${{ steps.app_version.outputs.build_name }} \
            --build-number=${{ steps.app_version.outputs.build_number }}

      - name: Build release AAB
        shell: bash
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        run: |
          flutter build appbundle --release \
            --build-name=${{ steps.app_version.outputs.build_name }} \
            --build-number=${{ steps.app_version.outputs.build_number }}

      - name: Rename outputs
        shell: bash
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        run: |
          set -euo pipefail

          ZIP_NAME="${{ steps.find_zip.outputs.zip_name }}"
          SAFE_NAME="${ZIP_NAME%.zip}"
          BUILD_NAME="${{ steps.app_version.outputs.build_name }}"
          BUILD_NUMBER="${{ steps.app_version.outputs.build_number }}"

          mkdir -p "$GITHUB_WORKSPACE/_outputs"

          cp build/app/outputs/flutter-apk/app-release.apk \
            "$GITHUB_WORKSPACE/_outputs/${SAFE_NAME}_${BUILD_NAME}_${BUILD_NUMBER}_release.apk"

          cp build/app/outputs/bundle/release/app-release.aab \
            "$GITHUB_WORKSPACE/_outputs/${SAFE_NAME}_${BUILD_NAME}_${BUILD_NUMBER}_release.aab"

          cat > "$GITHUB_WORKSPACE/_outputs/build_info.txt" <<EOF
          Selected ZIP: $ZIP_NAME
          Build name: $BUILD_NAME
          Build number: $BUILD_NUMBER
          Output APK: ${SAFE_NAME}_${BUILD_NAME}_${BUILD_NUMBER}_release.apk
          Output AAB: ${SAFE_NAME}_${BUILD_NAME}_${BUILD_NUMBER}_release.aab
          EOF

      - name: Upload release outputs
        uses: actions/upload-artifact@v4
        with:
          name: gamino-latest-release
          path: |
            _outputs/*.apk
            _outputs/*.aab
            _outputs/build_info.txt
